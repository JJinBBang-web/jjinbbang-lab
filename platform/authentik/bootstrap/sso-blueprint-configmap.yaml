apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-sso-blueprint
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "30"
data:
  jjinbbang-sso.yaml: |
    version: 1
    metadata:
      name: jjinbbang SSO providers
      labels:
        blueprints.goauthentik.io/description: "Argo CD OIDC and n8n forward-auth providers for jjinbbang-lab"
    entries:
      - model: authentik_core.group
        state: created
        id: jjinbbang-admins
        identifiers:
          name: jjinbbang-admins
      - model: authentik_core.group
        state: created
        id: jjinbbang-observers
        identifiers:
          name: jjinbbang-observers

      - model: authentik_core.user
        id: ryuwon-user
        identifiers:
          username: ryuwon
        attrs:
          name: 유준호
          email: !Env AUTHENTIK_BOOTSTRAP_EMAIL
          password: !Env AUTHENTIK_BOOTSTRAP_PASSWORD
          groups:
            - !Find [authentik_core.group, [name, authentik Admins]]
            - !KeyOf jjinbbang-admins

      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          client_type: confidential
          client_id: argocd
          client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argo.jjinbbang.kr/auth/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: argocd-application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          provider: !KeyOf argocd-provider

      - model: authentik_providers_proxy.proxyprovider
        id: n8n-provider
        identifiers:
          name: n8n
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: n8n
          client_secret: !Env N8N_PROXY_CLIENT_SECRET
          cookie_secret: !Env N8N_PROXY_COOKIE_SECRET
          external_host: https://n8n.jjinbbang.kr
          internal_host: ""
          internal_host_ssl_validation: true
          mode: forward_single
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        id: n8n-application
        identifiers:
          slug: n8n
        attrs:
          name: n8n
          provider: !KeyOf n8n-provider

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf n8n-application
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf n8n-application
          group: !KeyOf jjinbbang-admins
          order: 10
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf argocd-application
          group: !Find [authentik_core.group, [name, authentik Admins]]
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf argocd-application
          group: !KeyOf jjinbbang-admins
          order: 10
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf argocd-application
          group: !KeyOf jjinbbang-observers
          order: 20

      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [local, true]]
          _config:
            log_level: info
            docker_labels: null
            authentik_host: https://auth.jjinbbang.kr
            docker_network: null
            container_image: null
            docker_map_ports: true
            refresh_interval: minutes=5
            kubernetes_replicas: 1
            kubernetes_namespace: authentik
            authentik_host_browser: https://auth.jjinbbang.kr
            object_naming_template: ak-outpost-%(name)s
            authentik_host_insecure: true
            kubernetes_json_patches: null
            kubernetes_service_type: ClusterIP
            kubernetes_ingress_path_type: null
            kubernetes_image_pull_secrets: []
            kubernetes_ingress_class_name: null
            kubernetes_disabled_components: []
            kubernetes_ingress_annotations:
              cert-manager.io/cluster-issuer: letsencrypt-http01
            kubernetes_ingress_secret_name: authentik-outpost-tls
            kubernetes_httproute_annotations: {}
            kubernetes_httproute_parent_refs: []
          providers:
            - !KeyOf n8n-provider
