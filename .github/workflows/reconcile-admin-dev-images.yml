name: Reconcile admin dev images

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  packages: read

concurrency:
  group: update-admin-image
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PULL_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f

      - name: Reconcile develop images
        run: |
          set -euo pipefail
          for component in web server; do
            case "$component" in
              web)
                source_repository="JJinBBang-web/JJinBBang_Admin"
                image="ghcr.io/jjinbbang-web/jjinbbang-admin"
                ;;
              server)
                source_repository="JJinBBang-web/jjinbbang-server"
                image="ghcr.io/jjinbbang-web/jjinbbang-server"
                ;;
            esac

            source_sha="$(
              curl --fail --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$source_repository/commits/develop" |
                jq -r .sha
            )"
            if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid develop SHA for $component: $source_sha" >&2
              exit 1
            fi

            inspection="$(docker buildx imagetools inspect "$image:$source_sha" --raw)"
            if ! jq -e 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")' <<<"$inspection" >/dev/null; then
              echo "Develop image does not contain linux/arm64: $image:$source_sha" >&2
              exit 1
            fi

            image_digest="$(
              docker buildx imagetools inspect "$image:$source_sha" \
                --format '{{json .Manifest}}' | jq -r .digest
            )"
            if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest for $component: $image_digest" >&2
              exit 1
            fi

            COMPONENT="$component" \
              DEPLOY_ENVIRONMENT=dev \
              SOURCE_REPOSITORY="$source_repository" \
              SOURCE_REF=develop \
              SOURCE_SHA="$source_sha" \
              IMAGE="$image" \
              TAG="$source_sha" \
              IMAGE_DIGEST="$image_digest" \
              ./scripts/update-admin-image.sh
          done

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede

      - name: Validate desired state
        run: ./scripts/validate-manifests.sh

      - name: Commit desired state
        run: |
          target="apps/jjinbbang-admin/overlays/dev/kustomization.yaml"
          if git diff --quiet -- "$target"; then
            echo "Admin dev images are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "🔧 Chore: 관리자 dev 이미지 정기 조정"
          git push origin HEAD:main
