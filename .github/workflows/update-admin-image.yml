name: Update admin web or API image

on:
  repository_dispatch:
    types:
      - admin-image-built

permissions:
  contents: write

concurrency:
  group: update-admin-image
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PULL_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Validate dispatch payload
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EXPECTED_SENDER: ${{ vars.GITOPS_DISPATCH_SENDER }}
          DEPLOY_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          VALIDATE_ONLY: "true"
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_SENDER" || "$EVENT_SENDER" != "$EXPECTED_SENDER" ]]; then
            echo "unexpected dispatch sender: $EVENT_SENDER" >&2
            exit 1
          fi
          ./scripts/update-admin-image.sh
          SOURCE_BRANCH_SHA="$(
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$SOURCE_REPOSITORY/commits/$SOURCE_REF" |
              jq -r .sha
          )"
          if [[ "$SOURCE_BRANCH_SHA" != "$SOURCE_SHA" ]]; then
            echo "source SHA is not the current $COMPONENT $SOURCE_REF HEAD" >&2
            exit 1
          fi

      - name: Verify image digest in GHCR
        env:
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
          IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
        run: |
          set -euo pipefail
          inspection="$(docker buildx imagetools inspect "$IMAGE:$TAG" --raw)"
          if ! jq -e 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")' <<<"$inspection" >/dev/null; then
            echo "image does not contain linux/arm64" >&2
            exit 1
          fi

          RESOLVED_DIGEST="$(
            docker buildx imagetools inspect "$IMAGE:$TAG" \
              --format '{{json .Manifest}}' | jq -r .digest
          )"
          if [[ "$RESOLVED_DIGEST" != "$IMAGE_DIGEST" ]]; then
            echo "image digest does not match GHCR manifest" >&2
            exit 1
          fi

      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Update immutable image digest
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
          DEPLOY_ENVIRONMENT: ${{ github.event.client_payload.environment }}
        run: ./scripts/update-admin-image.sh

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Validate desired state
        run: ./scripts/validate-manifests.sh

      - name: Commit desired state
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          DEPLOY_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          target="apps/jjinbbang-admin/overlays/${DEPLOY_ENVIRONMENT}/kustomization.yaml"
          if git diff --quiet -- "$target"; then
            echo "Desired state already references ${COMPONENT}@${SOURCE_SHA}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "🔧 Chore: 관리자 ${COMPONENT} ${DEPLOY_ENVIRONMENT} 이미지 ${SOURCE_SHA} 반영"
          git push origin HEAD:main
