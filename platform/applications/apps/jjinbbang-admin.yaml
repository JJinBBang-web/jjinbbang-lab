apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jjinbbang-admin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: jjinbbang-admin
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/JJinBBang-web/jjinbbang-lab.git
    targetRevision: main
    path: apps/jjinbbang-admin
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
