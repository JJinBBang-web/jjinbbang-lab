apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: n8n
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/JJinBBang-web/jjinbbang-lab.git
    targetRevision: main
    path: platform/workloads/n8n
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
