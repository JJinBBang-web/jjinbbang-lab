name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'init/**'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
      - 'docs/**'
      - 'chore/**'

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python -m pip install --disable-pip-version-check pyyaml

      - run: |
          curl -fsSL -o kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - run: ./scripts/validate-manifests.sh
