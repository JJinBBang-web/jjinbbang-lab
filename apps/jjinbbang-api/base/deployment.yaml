apiVersion: apps/v1
kind: Deployment
metadata:
  name: jjinbbang-api
  labels:
    app.kubernetes.io/name: jjinbbang-api
    app.kubernetes.io/instance: jjinbbang-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jjinbbang-api
      app.kubernetes.io/instance: jjinbbang-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jjinbbang-api
        app.kubernetes.io/instance: jjinbbang-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.jjinbbang.dev/core
                    operator: DoesNotExist
      containers:
        - name: jjinbbang-api
          image: ghcr.io/jjinbbang-web/jjinbbang-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jjinbbang-api-config
            - secretRef:
                name: jjinbbang-api-secrets
          env:
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: jjinbbang-api-secrets
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: jjinbbang-api-secrets
                  key: REDIS_PORT
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jjinbbang-api-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/jjinbbang/config
              readOnly: true
            - name: google-credentials
              mountPath: /etc/jjinbbang/gcp
              readOnly: true
      volumes:
        - name: runtime-config
          secret:
            secretName: jjinbbang-api-runtime
            defaultMode: 0440
        - name: google-credentials
          secret:
            secretName: jjinbbang-api-google
            defaultMode: 0440
