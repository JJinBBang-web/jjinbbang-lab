apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argo.jjinbbang.kr
  admin.enabled: "false"
  users.anonymous.enabled: "false"
  oidc.config: |
    name: Authentik
    issuer: https://auth.jjinbbang.kr/application/o/argocd/
    clientID: argocd
    clientSecret: $argocd-oidc-secret:clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
