apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-apply-blueprints-v2
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-apply-blueprints
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node-role.jjinbbang.dev/ops: "true"
      containers:
        - name: apply-blueprints
          image: ghcr.io/goauthentik/server:2026.2.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: authentik
            - secretRef:
                name: authentik-bootstrap
            - secretRef:
                name: authentik-sso-bootstrap
          command:
            - sh
            - -ec
          args:
            - |
              python - <<'PY'
              import os
              import socket
              import time

              host = os.environ["AUTHENTIK_POSTGRESQL__HOST"]
              port = int(os.environ.get("AUTHENTIK_POSTGRESQL__PORT", "5432"))
              deadline = time.time() + 300

              while True:
                  try:
                      with socket.create_connection((host, port), timeout=5):
                          break
                  except OSError:
                      if time.time() > deadline:
                          raise
                      time.sleep(5)
              PY
              ak apply_blueprint /blueprints/system/bootstrap.yaml /blueprints/custom/jjinbbang-sso.yaml
              ak shell -c '
              from authentik.outposts.models import Outpost

              outpost = Outpost.objects.get(name="authentik Embedded Outpost")
              config = outpost._config
              config.update({
                  "authentik_host": "https://auth.jjinbbang.kr",
                  "authentik_host_browser": "https://auth.jjinbbang.kr",
                  "authentik_host_insecure": True,
                  "kubernetes_ingress_annotations": {
                      "cert-manager.io/cluster-issuer": "letsencrypt-http01",
                  },
              })
              outpost._config = config
              outpost.save(update_fields=["_config"])
              '
          volumeMounts:
            - name: sso-blueprint
              mountPath: /blueprints/custom
              readOnly: true
      volumes:
        - name: sso-blueprint
          configMap:
            name: authentik-sso-blueprint
